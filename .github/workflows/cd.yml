name: Despliegue continuo

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-upload:
    name: Generar y subir APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos de ejecución al Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Construir el APK de depuración
        run: ./gradlew assembleDebug

      - name: Renombrar el APK con el número de ejecución
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-v${{ github.run_number }}.apk

      - name: Subir el APK a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-app
          path: app/build/outputs/apk/debug/app-debug-v${{ github.run_number }}.apk
          retention-days: 90
